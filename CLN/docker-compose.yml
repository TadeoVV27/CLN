services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${DB_NAME:-ferremax}
      MYSQL_USER: ${DB_USER:-ferremax_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ferremax}
      DB_USER: ${DB_USER:-ferremax_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
    depends_on:
      db:
        condition: service_healthy
    command: python -c "print('Configurar inicio de API FerreMax')"

  tests:
    build: .
    environment:
      PYTHONPATH: /app
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ferremax}
      DB_USER: ${DB_USER:-ferremax_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
    depends_on:
      db:
        condition: service_healthy
    command: python -m pytest tests -v

volumes:
  mysql_data:
