name: FerreMax - Pruebas automatizadas

on:
  push:
    branches:
      - main
      - infra/docker-ci
      - feature/pruebas-unitarias

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CLN

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Ejecutar pruebas y medir cobertura
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ \
            --cov=src \

            --cov-report=term-missing \
            --cov-fail-under=80


  docker:
    name: Verificar Docker y MySQL
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar configuracion de Docker Compose
        working-directory: ./CLN
        run: docker compose config --quiet

      - name: Construir imagen de FerreMax
        working-directory: ./CLN
        run: docker compose build

      - name: Iniciar MySQL
        working-directory: ./CLN
        run: docker compose up -d --wait db

      - name: Verificar conexion a MySQL
        working-directory: ./CLN
        run: |
          docker compose exec -T db \
            mysql -h 127.0.0.1 \
            -u"$DB_USER" -p"$DB_PASSWORD" \
            -e "SELECT 1;" "$DB_NAME"
        env:
          DB_USER: ferremax_user
          DB_PASSWORD: change_me
          DB_NAME: ferremax

      - name: Mostrar estado de contenedores
        if: always()
        working-directory: ./CLN
        run: docker compose ps

      - name: Detener contenedores
        if: always()
        working-directory: ./CLN
        run: docker compose down
